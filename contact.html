<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | DoBu Martial Arts</title><meta name="description" content="DoBu Martial Arts — strength, courage, discipline and world-class martial arts training.">
<meta name="theme-color" content="#05080f"><link rel="stylesheet" href="css/style.css">  <link rel="icon" type="image/png" href="assets/logo.png">
</head><body><section class="page-hero"><div class="container reveal"><span class="eyebrow">Get started</span><h1>Talk to the team.</h1><p class="lead" style="margin-top:20px">Ask about classes, memberships, private tuition or your first session.</p></div></section><section class="section"><div class="container"><div class="card form-card reveal"><form id="contact-form"><div class="form-grid"><div class="field"><label for="cname">Name</label><input id="cname" required></div><div class="field"><label for="cemail">Email</label><input id="cemail" type="email" required></div><div class="field"><label for="cphone">Phone</label><input id="cphone" type="tel"></div><div class="field"><label for="creason">Reason</label><select id="creason"><option>General enquiry</option><option>Membership</option><option>Class timetable</option><option>Private tuition</option></select></div><div class="field full"><label for="cmessage">Message</label><textarea id="cmessage" required></textarea></div></div><button class="btn btn-primary" style="margin-top:18px">Send enquiry</button><div id="contact-msg" class="form-msg"></div></form></div></div></section>
<script>document.addEventListener("DOMContentLoaded",()=>{const f=document.querySelector("#contact-form");f?.addEventListener("submit",e=>{e.preventDefault();const m=document.querySelector("#contact-msg");m.textContent="Thanks — your enquiry has been captured for this prototype.";m.className="form-msg show success";f.reset()})})</script><div class="toast"></div><script src="js/main.js"></script></body></html>
