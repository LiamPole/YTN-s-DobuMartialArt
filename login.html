<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account | DoBu Martial Arts</title><meta name="description" content="DoBu Martial Arts — strength, courage, discipline and world-class martial arts training.">
<meta name="theme-color" content="#05080f"><link rel="stylesheet" href="css/style.css">  <link rel="icon" type="image/png" href="assets/logo.png">
</head><body><main class="auth-shell"><section class="auth-box reveal"><div style="text-align:center"><span class="eyebrow">Member account</span><h1 id="auth-title" style="font-size:2.5rem">Welcome back</h1><p id="auth-sub" class="muted" style="margin-top:10px">Log in to manage your membership and classes.</p></div>
<div class="auth-tabs"><button id="tab-login" class="active">Login</button><button id="tab-register">Create account</button></div>
<form id="auth-form"><div id="name-field" class="field hidden" style="display:none"><label for="name">Full name</label><input id="name" autocomplete="name"></div><div class="field" style="margin-top:12px"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:12px"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div><button id="auth-submit" class="btn btn-primary" style="width:100%;margin-top:20px">Log in</button><div id="form-msg" class="form-msg"></div></form>
<p class="muted" style="font-size:.76rem;margin-top:16px">Prototype authentication uses browser localStorage so the account flow works without exposing data to a server. A production release should use secure server-side authentication.</p></section></main><div class="toast"></div><script src="js/main.js"></script></body></html>
